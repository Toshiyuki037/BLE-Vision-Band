# Vision Band nRF5340 network-core HCI IPC throughput configuration
#
# Purpose:
#   Enable Bluetooth LE Data Length Extension (DLE) on the controller
#   running on the nRF5340 network core.
#
# The application core already negotiates ATT MTU 247 and LE 2M PHY.
# Without controller DLE, ATT notifications are fragmented into small
# Link Layer packets, which destroys image-transfer throughput.

CONFIG_BT_DATA_LEN_UPDATE=y

# HCI ACL payload capacity between application-core Host and
# network-core Controller.
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# Allow the controller to place up to 251 bytes in one LE Data PDU.
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
