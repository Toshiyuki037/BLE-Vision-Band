CONFIG_I2C=y

CONFIG_SPI=y

CONFIG_GPIO=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Vision Band"
CONFIG_BT_MAX_CONN=1

CONFIG_LOG=n

# Phase 6C: allow a 247-byte ATT MTU on the application-core host.
# Notification value payload is ATT_MTU - 3 bytes.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251

# Phase 6C throughput: allow the host to queue multiple ACL packets
# instead of serializing the JPEG through a tiny default TX pool.
CONFIG_BT_BUF_ACL_TX_COUNT=10

# Expose PHY/data-length update APIs and bt_conn_cb callback members.
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y

# Zephyr requires Event RX count > ACL TX count.
# ACL TX count is 10 for the Phase 6C streaming queue.
CONFIG_BT_BUF_EVT_RX_COUNT=11
